name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile collector.py install.py demo.py tools/update_catalog.py
      - run: bash -n launch.sh refresh.sh go-collector.sh
